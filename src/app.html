<html lang="en" style="color-scheme: dark;">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!-- `viewport-fit=cover` lets the page extend under the Android status bar and the camera cutout,
         which is what `enableEdgeToEdge()` in MainActivity asks the system for. It is also what makes
         the `env(safe-area-inset-*)` values below non-zero; without it they are always 0 and the app
         would simply be letterboxed instead. No effect on desktop WebViews. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <style>
      /* The app is a full-screen cockpit, not a scrollable page: never let trackpad/touch gestures
         scroll-chain or bounce the whole frame (the per-panel scrollers handle their own overflow). */
      html, body { overscroll-behavior: none; }

      /* Distance from each screen edge that is unsafe to put controls in — on Android, the display
         cutout (and the system bars, when they are shown; MainActivity hides them). Held in landscape
         as a GCS is, the cutout eats into the LEFT or RIGHT edge, exactly where the toolbar's brand
         and its control cluster sit, so the horizontal insets are the ones that matter here.

         Only the chrome consumes these — the toolbar and the status bar pad their own contents. The
         map deliberately does NOT: it runs full-bleed underneath, because a black bar down the camera
         edge costs more than a few pixels of map hidden behind a hole. All four fall back to 0px, so
         on desktop every rule that reads them is a no-op. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      /* Touch: the long-press text selection and the blue tap flash are desktop-mouse idioms that only
         get in the way of dragging a waypoint. Panning/zooming is deliberately NOT blocked here — the
         panels scroll themselves and the map handles its own gestures; page zoom is already ruled out
         by `user-scalable=no` above. */
      body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    </style>
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
